<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>เกมเรียงลำดับขนาด เล็ก-ใหญ่ (อาชีพอาเซียน) สำหรับเด็กอนุบาล</title>
  <link rel="stylesheet" href="css/style.css?v=1.3.7">
  <link rel="stylesheet" href="css/size-game.css?v=1.3.7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&family=Mitr:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-viewport">
    <!-- Blurred Background Landscape Layer -->
    <div class="game-bg-layer" aria-hidden="true"></div>
    
    <!-- Top Header -->
    <header class="game-header">
      <!-- Home & Level Counter Badge -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <a href="index.html" class="action-btn" title="กลับหน้าเมนูหลัก" style="text-decoration: none;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
        </a>
        <div class="level-badge" id="levelBadge">
          <span id="levelBadgeText">ด่านที่ 1 / 8</span>
        </div>
        <span class="version-tag-pill">v1.3.7</span>
      </div>

      <!-- Title Pill -->
      <div class="game-title-container">
        <h1 class="game-title">
          <span class="emoji-icon">📏</span>
          <span>เรียงลำดับขนาด เล็ก - ใหญ่</span>
          <span class="emoji-icon">🌟</span>
        </h1>
      </div>

      <!-- Right Action Badges -->
      <div class="header-actions">
        <!-- Current Profession Badge Icon -->
        <div class="profession-badge-btn" id="professionBadgeBtn" title="ข้อมูลอาชีพ">
          <img id="professionBadgeImg" src="assets/images/professions/badge_doctor.png" alt="อาชีพ" class="badge-img">
        </div>

        <!-- Music & Sound Toggle Button -->
        <button class="action-btn" id="audioToggleBtn" title="เปิด/ปิด เสียง">
          <svg id="audioIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>

        <!-- Shuffle / Next Profession Button -->
        <button class="action-btn" id="reloadRoundBtn" title="สุ่มอาชีพใหม่">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Playing Board (Size Sorting 2-Column Board) -->
    <main class="size-board">
      
      <!-- Left Column: Shuffled 4 Sizes Cards -->
      <section class="size-column left-size-column">
        <div class="column-header-pill">
          <span>👇 แตะค้างแล้วลากภาพ</span>
        </div>
        <div class="size-cards-grid" id="leftCardsContainer" aria-label="ภาพขนาดต่างๆ แบบสุ่ม">
          <!-- Rendered dynamically by JavaScript -->
        </div>
      </section>

      <!-- Center Guide Divider -->
      <div class="center-guide-column">
        <div class="guide-pill size-guide-pill">
          <span class="guide-text-top">เรียงลำดับ</span>
          <span class="guide-arrow">➔</span>
          <span class="guide-text-bottom">จาก เล็ก ไป ใหญ่ ⬇️</span>
        </div>
      </div>

      <!-- Right Column: 4 Drop Zones Ordered Top-to-Bottom (Smallest to Largest) -->
      <section class="size-column right-size-column">
        <div class="column-header-pill target-pill">
          <span>🎯 ช่องเรียงลำดับ (เล็ก ➔ ใหญ่)</span>
        </div>
        <div class="size-slots-container" id="rightSlotsContainer" aria-label="ช่องวางเรียงลำดับขนาด">
          <!-- Rendered dynamically by JavaScript -->
        </div>
      </section>

    </main>

  </div>

  <!-- Confetti Canvas for Victory Celebrations -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Celebration Modal (เก่งมากและเปลี่ยนด่านต่อไป) -->
  <div class="celebration-overlay" id="celebrationOverlay">
    <div class="celebration-card">
      <div class="stars-row">
        <span class="star-pop">⭐</span>
        <span class="star-pop">⭐</span>
        <span class="star-pop">⭐</span>
      </div>

      <h2 class="celebration-title" id="celebrationTitle">เก่งมากเลยคนเก่ง! 🎉</h2>
      <p class="celebration-subtitle" id="celebrationSubtitle">เรียงลำดับขนาดอาชีพถูกต้องครบทั้ง 4 ขนาดแล้ว</p>

      <div class="size-summary-row" id="sizeSummaryRow">
        <!-- Rendered dynamically -->
      </div>

      <button class="btn-next-level" id="btnNextLevel">
        <span>เล่นอาชีพต่อไป</span>
        <span>➔</span>
      </button>

      <span class="auto-countdown-text" id="autoCountdownText">เปลี่ยนด่านถัดไปอัตโนมัติใน 4 วินาที...</span>
    </div>
  </div>

  <!-- Profession Info Modal -->
  <div class="asean-modal-overlay" id="professionModalOverlay" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="asean-modal-card">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <span class="modal-emoji">👩‍⚕️</span>
          <h2 class="modal-title" id="modalProfName">8 อาชีพอาเซียน</h2>
        </div>
        <button class="modal-close-btn" id="modalCloseBtn" aria-label="ปิดหน้าต่าง">✕</button>
      </div>

      <div class="professions-picker-grid" id="professionsPickerGrid">
        <!-- List of 8 professions for easy switching -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/audio.js?v=1.3.7"></script>
  <script src="js/professions-data.js?v=1.3.7"></script>
  <script src="js/size-game.js?v=1.3.7"></script>
</body>
</html>
