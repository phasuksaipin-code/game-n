<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>เกมเรียงลำดับเหตุการณ์ก่อน - หลัง สำหรับเด็กปฐมวัย</title>
  <link rel="stylesheet" href="css/style.css?v=1.3.7">
  <link rel="stylesheet" href="css/event-sequencing.css?v=1.3.7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&family=Mitr:wght@500;700&family=Sarabun:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="event-viewport">
    <!-- Animated Soft Atmosphere Background -->
    <div class="event-bg-layer" aria-hidden="true"></div>

    <!-- Top Header -->
    <header class="event-header">
      <div class="header-left">
        <!-- Back to Hub / Main Menu (Unified Circular Blue) -->
        <a href="index.html" class="action-btn" title="กลับหน้าเมนูหลัก" style="text-decoration: none;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
        </a>
        <span class="version-tag-pill">v1.3.7</span>
      </div>

      <!-- Title Pill -->
      <div class="event-title-pill">
        <span>⏳</span>
        <h1>เกมเรียงลำดับเหตุการณ์</h1>
        <span class="level-badge-pill" id="headerLevelBadge">เรื่องที่ 1 / 5</span>
      </div>

      <div class="header-right">
        <!-- Sound & Music Toggle -->
        <button class="action-btn" id="audioToggleBtn" title="เปิด/ปิด เสียงดนตรี">
          <svg id="audioIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>

        <!-- Reset Board Button -->
        <button class="action-btn" id="btnResetBoard" title="รีเซ็ตกระดาน">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 5 Stories Selector Navigation Bar -->
    <nav class="stories-selector-bar" id="storiesSelectorBar" aria-label="เลือกเรื่องเหตุการณ์">
      <!-- Injected via JavaScript -->
    </nav>

    <!-- Main Game Play Stage -->
    <main class="event-play-arena">

      <!-- The Illustrated Board Frame (1536x1024 with 5 slots) -->
      <section class="event-board-wrapper" aria-label="กระดานเรียงลำดับเหตุการณ์">
        <div class="event-board-frame" id="eventBoardFrame">
          <!-- Active Story Pill Badge -->
          <div class="board-story-pill" id="boardStoryPill">
            <span class="board-story-emoji" id="boardStoryEmoji">🏪</span>
            <span class="board-story-name" id="boardStoryName">ไปซื้อของที่ร้านสะดวกซื้อ</span>
          </div>

          <!-- The 5 Order Slots Container overlaid directly on the 5 illustrated boxes -->
          <div class="event-slots-grid" id="eventSlotsGrid">
            <!-- 5 Slots generated via JS -->
          </div>
        </div>
      </section>

      <!-- Right Side Options Tray (Shuffled 5 Event Cards in 1 Vertical Column) -->
      <aside class="event-tray-dock" aria-label="กล่องตัวเลือกชิ้นส่วน">
        <div class="tray-dock-header">
          <div class="tray-dock-title">
            <span>📦</span>
            <span>ชิ้นส่วนเหตุการณ์:</span>
          </div>
          <div class="tray-dock-hint" id="trayProgressText">เหลืออีก 5 ชิ้น</div>
        </div>

        <!-- 5 Draggable Event Cards in Vertical Column -->
        <div class="event-tray-cards-col" id="eventTrayCardsCol">
          <!-- Injected and shuffled via JS -->
        </div>
      </aside>

    </main>

    <!-- Celebration Modal Overlay -->
    <div class="celebration-overlay" id="celebrationOverlay" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="celebration-card">
        <div class="celebration-badge-trophy">🏆</div>
        <h2 class="celebration-title" id="celebrationTitle">ยอดเยี่ยมมากเลยค่ะ! 🌟</h2>
        <p class="celebration-desc" id="celebrationDesc">หนูเรียงลำดับเหตุการณ์ถูกต้องครบทุกขั้นตอน เก่งมาก ๆ เลยค่ะ!</p>
        
        <div class="celebration-actions">
          <button class="btn-celebrate btn-secondary" id="btnCelebrationReplay">
            <span>🔄</span>
            <span>เล่นอีกครั้ง</span>
          </button>
          <button class="btn-celebrate btn-primary" id="btnCelebrationNext">
            <span>เรื่องถัดไป</span>
            <span>➔</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Fullscreen Confetti Canvas -->
    <canvas id="confettiCanvas"></canvas>
  </div>

  <!-- Scripts -->
  <script src="js/audio.js?v=1.3.7"></script>
  <script src="js/event-sequencing-data.js?v=1.3.7"></script>
  <script src="js/event-sequencing-game.js?v=1.3.7"></script>
</body>
</html>
