<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>เกมเลือกพยัญชนะตรงกับรูปภาพ ก - ฮ สำหรับเด็กปฐมวัย</title>
  <link rel="stylesheet" href="css/style.css?v=1.3.7">
  <link rel="stylesheet" href="css/thai-select.css?v=1.3.7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Krub:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="select-viewport">
    <!-- Ambient Animated Background Layer -->
    <div class="select-bg-layer" aria-hidden="true"></div>

    <!-- Top Header -->
    <header class="select-header">
      <div class="header-left">
        <!-- Back to Hub Button -->
        <a href="index.html" class="action-btn" title="กลับหน้าเมนูหลัก" style="text-decoration: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
        </a>
        <span class="version-tag-pill">v1.3.7</span>
      </div>

      <!-- Title Pill -->
      <div class="select-title-pill">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#f43f5e">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <h1>เกมเลือกพยัญชนะตรงกับรูปภาพ</h1>
        <span class="mode-badge-pill" id="modeBadge">โหมดเรียงพยัญชนะ ก - ฮ</span>
      </div>

      <div class="header-right">
        <!-- Sound Toggle -->
        <button class="action-btn" id="audioToggleBtn" title="เปิด/ปิด เสียง">
          <svg id="audioIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>

        <!-- Reset / Restart Current Card Button -->
        <button class="action-btn" id="btnResetBoard" title="เริ่มรอบนี้ใหม่ / รีเซ็ต">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Sub-Navigation Controls -->
    <nav class="select-subnav">
      <!-- Previous Card Button -->
      <div class="nav-cluster">
        <button class="nav-step-btn" id="btnPrev" title="ข้อก่อนหน้า">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          <span>ก่อนหน้า</span>
        </button>
      </div>

      <!-- Current Card Pill (Opens 44 Quick Jump Modal) -->
      <div class="current-card-pill" id="currentCardPill" title="คลิกเพื่อเลือกพยัญชนะที่ต้องการ">
        <span class="index-badge" id="cardIndexBadge">1 / 44</span>
        <span id="cardNameText">ก ไก่</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
      </div>

      <!-- Next Card Button & Mode Switcher -->
      <div class="nav-cluster">
        <button class="nav-step-btn" id="btnNext" title="ข้อถัดไป">
          <span>ถัดไป</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>

        <div class="mode-toggle-group">
          <button class="mode-tab-btn active" id="tabSequential" title="เล่นเรียงตามตัวอักษร ก ถึง ฮ">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            <span>เรียงอักษร</span>
          </button>
          <button class="mode-tab-btn" id="tabRandom" title="สุ่มบัตรคำเพื่อความท้าทาย">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            <span>สุ่มบัตรคำ</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Play Arena -->
    <main class="select-play-arena">

      <!-- Center Flashcard Display Stage -->
      <div class="flashcard-display-stage" id="flashcardStage">
        <!-- Authentic Flashcard Image (Single Sliced Card) -->
        <img id="flashcardImg" class="flashcard-image" src="assets/images/select_TH_cards/card_01_ko_kai.jpg" alt="บัตรคำพยัญชนะไทย">

        <!-- 3 Interactive Touch Targets Over The Flashcard Choice Boxes -->
        <div class="card-choices-overlay" aria-label="ช่องตัวเลือกบนบัตรคำ">
          <button class="choice-target" data-index="0" title="เลือกช่องที่ 1" aria-label="ตัวเลือกที่ 1"></button>
          <button class="choice-target" data-index="1" title="เลือกช่องที่ 2" aria-label="ตัวเลือกที่ 2"></button>
          <button class="choice-target" data-index="2" title="เลือกช่องที่ 3" aria-label="ตัวเลือกที่ 3"></button>
        </div>
      </div>

      <!-- Prompt Tip & Audio Reading Bar -->
      <div class="prompt-action-bar">
        <div class="prompt-tip-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#f43f5e" style="flex-shrink: 0;">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
          </svg>
          <span id="promptTipText">รูปนี้ตรงกับพยัญชนะตัวไหนเอ่ย? (ก ไก่)</span>
        </div>

        <button class="btn-speak-question" id="btnSpeakQuestion" title="ฟังเสียงอ่านโจทย์">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <span>ฟังเสียงอ่าน</span>
        </button>
      </div>

    </main>

    <!-- Modal 1: 44 Consonants Quick Jump Grid (ก - ฮ) -->
    <div class="modal-overlay" id="pickerModal" aria-modal="true" role="dialog">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#f43f5e"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
            <span>เลือกพยัญชนะไทย (44 ตัวอักษร ก - ฮ)</span>
          </div>
          <button class="modal-close-btn" id="btnClosePicker" title="ปิดหน้าต่าง">✕</button>
        </div>
        <div class="letter-grid-44" id="letterGrid44">
          <!-- Dynamically Injected via JS -->
        </div>
      </div>
    </div>

    <!-- Modal 2: Victory Celebration Popup -->
    <div class="modal-overlay" id="celebrationModal" aria-modal="true" role="dialog">
      <div class="modal-card celebration-modal-card">
        <div class="celebration-badge-hero">
          <svg width="50" height="50" viewBox="0 0 24 24" fill="#eab308">
            <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
          </svg>
        </div>
        <h2 class="celebration-title">สุดยอดมากจ้าคนเก่ง!</h2>
        <p class="celebration-desc" id="celebrationScoreText">ตอบถูกครบทั้ง 44 พยัญชนะ (ก - ฮ) เก่งที่สุดเลย!</p>
        <div class="celebration-actions">
          <button class="btn-celebration-action secondary" onclick="window.location.href='index.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>กลับหน้าหลัก</span>
          </button>
          <button class="btn-celebration-action primary" id="btnRestartCelebration">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            <span>เล่นใหม่อีกครั้ง</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Confetti Layer -->
    <canvas id="confettiCanvas"></canvas>
  </div>

  <!-- Scripts -->
  <script src="js/audio.js?v=1.3.7"></script>
  <script src="js/thai-select-data.js?v=1.3.7"></script>
  <script src="js/thai-select-game.js?v=1.3.7"></script>
</body>
</html>
