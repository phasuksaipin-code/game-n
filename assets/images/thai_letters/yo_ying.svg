<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="skin3d" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="60%" stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </radialGradient>
    <radialGradient id="blush3d" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hair3d" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="silkDress3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="40%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="goldSash3d" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="eyeGloss" cx="30%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="flowerPetal" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Hair Bun in Back -->
    <circle cx="340" cy="140" r="50" fill="url(#hair3d)"/>
    <!-- Traditional Floral Hairpin -->
    <circle cx="340" cy="140" r="18" fill="url(#flowerPetal)"/>
    <circle cx="340" cy="140" r="8" fill="#f59e0b"/>
    <circle cx="348" cy="132" r="5" fill="#f43f5e"/>

    <!-- Body & Thai Silk Dress -->
    <path d="M 175 320 Q 250 290 325 320 L 355 435 Q 250 450 145 435 Z" fill="url(#silkDress3d)"/>
    
    <!-- Shimmering Golden Sash (สไบทอง) -->
    <path d="M 180 320 L 290 435 L 340 435 L 230 320 Z" fill="url(#goldSash3d)"/>
    <!-- Gold Brooch -->
    <circle cx="215" cy="335" r="12" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="215" cy="335" r="6" fill="#ef4444"/>

    <!-- 3D Head -->
    <circle cx="250" cy="205" r="105" fill="url(#skin3d)"/>

    <!-- 3D Hair Front Fringe -->
    <path d="M 150 185 Q 250 95 350 185 Q 290 140 250 142 Q 190 140 150 185 Z" fill="url(#hair3d)"/>

    <!-- Blushing Cheeks -->
    <circle cx="185" cy="235" r="24" fill="url(#blush3d)"/>
    <circle cx="315" cy="235" r="24" fill="url(#blush3d)"/>

    <!-- Pixar Glossy Eyes -->
    <ellipse cx="205" cy="205" rx="18" ry="24" fill="url(#eyeGloss)"/>
    <ellipse cx="295" cy="205" rx="18" ry="24" fill="url(#eyeGloss)"/>
    <!-- Specular Eye Glints -->
    <circle cx="199" cy="195" r="7" fill="#ffffff"/>
    <circle cx="210" cy="215" r="3.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="289" cy="195" r="7" fill="#ffffff"/>
    <circle cx="300" cy="215" r="3.5" fill="#ffffff" opacity="0.8"/>

    <!-- Cute Nose & Mouth -->
    <circle cx="250" cy="225" r="4" fill="#fda4af"/>
    <path d="M 234 245 Q 250 262 266 245" fill="none" stroke="#e11d48" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Cute 3D Hands in Wai Greeting -->
    <ellipse cx="250" cy="355" rx="26" ry="32" fill="url(#skin3d)"/>
    <path d="M 240 330 L 250 315 L 260 330" fill="none" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>

  </g>
</svg>