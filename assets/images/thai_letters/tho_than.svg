<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="goldThrone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <radialGradient id="rubyGem2" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Upper Royal Red Cushion -->
    <path d="M 120 170 Q 250 145 380 170 L 370 220 Q 250 245 130 220 Z" fill="#b91c1c"/>
    <ellipse cx="250" cy="170" rx="130" ry="24" fill="#dc2626"/>
    <ellipse cx="250" cy="168" rx="115" ry="18" fill="#ef4444"/>

    <!-- Lotus Petal Tier Top (บัวคว่ำ) -->
    <path d="M 100 225 Q 250 255 400 225 L 380 285 Q 250 310 120 285 Z" fill="url(#goldThrone)"/>

    <!-- Mid Column Waist (เอวคอด) -->
    <path d="M 135 285 Q 250 305 365 285 L 350 345 Q 250 365 150 345 Z" fill="url(#goldThrone)"/>

    <!-- Bottom Lotus Base (บัวหงาย) -->
    <path d="M 80 350 Q 250 380 420 350 L 440 425 Q 250 455 60 425 Z" fill="url(#goldThrone)"/>

    <!-- Gem Ornaments -->
    <circle cx="250" cy="265" r="11" fill="url(#rubyGem2)"/>
    <circle cx="190" cy="260" r="9" fill="#10b981"/>
    <circle cx="310" cy="260" r="9" fill="#3b82f6"/>

    <circle cx="250" cy="385" r="14" fill="url(#rubyGem2)"/>
    <circle cx="180" cy="380" r="11" fill="#10b981"/>
    <circle cx="320" cy="380" r="11" fill="#3b82f6"/>
    <circle cx="120" cy="375" r="9" fill="url(#rubyGem2)"/>
    <circle cx="380" cy="375" r="9" fill="#10b981"/>

  </g>
</svg>