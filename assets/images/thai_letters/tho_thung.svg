<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="pouchBag" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>
    <linearGradient id="tiedRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Main Chubby Pouch Body -->
    <ellipse cx="250" cy="310" rx="145" ry="125" fill="url(#pouchBag)"/>

    <!-- Pouch Neck & Frilled Top -->
    <path d="M 180 185 Q 250 205 320 185 L 340 105 Q 250 125 160 105 Z" fill="url(#pouchBag)"/>

    <!-- Tied Red Silk Ribbon & Bow -->
    <rect x="180" y="180" width="140" height="24" rx="12" fill="url(#tiedRibbon)"/>
    <circle cx="250" cy="192" r="18" fill="#b91c1c"/>
    <path d="M 250 192 Q 220 230 190 250 Q 225 210 250 192 Z" fill="#ef4444"/>
    <path d="M 250 192 Q 280 230 310 250 Q 275 210 250 192 Z" fill="#ef4444"/>

    <!-- Cute Smiling Face on Pouch -->
    <circle cx="210" cy="300" r="14" fill="#1e293b"/>
    <circle cx="290" cy="300" r="14" fill="#1e293b"/>
    <circle cx="206" cy="295" r="5" fill="#ffffff"/>
    <circle cx="286" cy="295" r="5" fill="#ffffff"/>
    <circle cx="185" cy="320" r="14" fill="#ef4444" opacity="0.3"/>
    <circle cx="315" cy="320" r="14" fill="#ef4444" opacity="0.3"/>
    <path d="M 235 325 Q 250 345 265 325" fill="none" stroke="#713f12" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Sparkling Golden Coins around base -->
    <circle cx="130" cy="410" r="22" fill="#fde047" stroke="#ca8a04" stroke-width="3"/>
    <circle cx="370" cy="410" r="22" fill="#fde047" stroke="#ca8a04" stroke-width="3"/>

  </g>
</svg>