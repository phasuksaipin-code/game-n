<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="chainGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Top Link -->
    <rect x="180" y="80" width="140" height="90" rx="45" fill="none" stroke="url(#chainGold)" stroke-width="32"/>

    <!-- Middle Link (Interlocked with cute face) -->
    <rect x="150" y="195" width="200" height="110" rx="55" fill="none" stroke="url(#chainGold)" stroke-width="34"/>

    <!-- Bottom Link -->
    <rect x="180" y="325" width="140" height="90" rx="45" fill="none" stroke="url(#chainGold)" stroke-width="32"/>

    <!-- Cute Eyes & Smile on Central Link -->
    <circle cx="215" cy="250" r="14" fill="#0f172a"/>
    <circle cx="285" cy="250" r="14" fill="#0f172a"/>
    <circle cx="211" cy="244" r="5" fill="#ffffff"/>
    <circle cx="281" cy="244" r="5" fill="#ffffff"/>
    <path d="M 235 275 Q 250 290 265 275" fill="none" stroke="#713f12" stroke-width="4" stroke-linecap="round"/>

  </g>
</svg>