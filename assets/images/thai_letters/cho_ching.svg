<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="cymbalGold" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Red Tasseled Silk Cord connecting both cymbals -->
    <path d="M 190 190 Q 250 110 310 190" fill="none" stroke="#dc2626" stroke-width="12" stroke-linecap="round"/>

    <!-- Left Cymbal -->
    <ellipse cx="185" cy="245" rx="75" ry="55" fill="url(#cymbalGold)"/>
    <circle cx="185" cy="235" r="24" fill="#fde047"/>
    <circle cx="185" cy="230" r="10" fill="#b45309"/>

    <!-- Right Cymbal -->
    <ellipse cx="315" cy="245" rx="75" ry="55" fill="url(#cymbalGold)"/>
    <circle cx="315" cy="235" r="24" fill="#fde047"/>
    <circle cx="315" cy="230" r="10" fill="#b45309"/>

    <!-- Musical Rhythm Notes floating -->
    <path d="M 235 130 L 255 125 L 255 155" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="235" cy="155" r="7" fill="#f59e0b"/>

  </g>
</svg>