<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="plateCeramic" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Round 3D Ceramic Plate with Rim -->
    <ellipse cx="250" cy="275" rx="180" ry="145" fill="url(#plateCeramic)"/>
    <ellipse cx="250" cy="275" rx="140" ry="110" fill="#ffffff"/>
    <ellipse cx="250" cy="275" rx="135" ry="105" fill="#f8fafc"/>

    <!-- Delicious 3D Strawberry Shortcake slice on plate -->
    <path d="M 190 280 L 310 240 L 330 290 L 205 325 Z" fill="#fed7aa"/>
    <path d="M 190 280 L 310 240 L 280 200 L 160 235 Z" fill="#ffffff"/>
    <ellipse cx="225" cy="215" rx="22" ry="24" fill="#ef4444"/>
    <polygon points="225,185 220,195 230,195" fill="#22c55e"/>

    <!-- Cute Smiling Face on Plate -->
    <circle cx="215" cy="335" r="10" fill="#64748b"/>
    <circle cx="285" cy="335" r="10" fill="#64748b"/>
    <path d="M 235 350 Q 250 365 265 350" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

  </g>
</svg>