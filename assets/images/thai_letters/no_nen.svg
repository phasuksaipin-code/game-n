<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="monkSkin" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="65%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </radialGradient>
    <linearGradient id="saffronRobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <radialGradient id="almsBowl" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Saffron Robe Body -->
    <path d="M 160 300 Q 250 270 340 300 L 365 435 Q 250 455 135 435 Z" fill="url(#saffronRobe)"/>
    <!-- Fold Draped over Shoulder -->
    <path d="M 160 300 L 290 435 L 340 435 L 210 290 Z" fill="#c2410c"/>

    <!-- Bald Cute Head -->
    <circle cx="250" cy="180" r="95" fill="url(#monkSkin)"/>

    <!-- Serene Eyes -->
    <path d="M 195 180 Q 210 195 225 180" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 275 180 Q 290 195 305 180" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Blushing Cheeks & Smile -->
    <circle cx="185" cy="205" r="18" fill="#ea580c" opacity="0.3"/>
    <circle cx="315" cy="205" r="18" fill="#ea580c" opacity="0.3"/>
    <path d="M 235 220 Q 250 235 265 220" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>

    <!-- Alms Bowl Held in Hands (บาตรพระ) -->
    <ellipse cx="250" cy="365" rx="50" ry="32" fill="url(#almsBowl)"/>
    <ellipse cx="250" cy="350" rx="42" ry="14" fill="#334155"/>

  </g>
</svg>