<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="poleGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="steelBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="rubyRound" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Long Polished Wooden/Golden Pole -->
    <rect x="236" y="160" width="28" height="270" rx="14" fill="url(#poleGold)"/>
    
    <!-- Royal Spearhead Socket -->
    <path d="M 215 170 Q 250 190 285 170 L 275 125 L 225 125 Z" fill="url(#poleGold)"/>
    <circle cx="250" cy="150" r="10" fill="url(#rubyRound)"/>
    
    <!-- Razor Sharp 3D Spearhead Blade with Crescent Hook -->
    <path d="M 250 35 L 278 125 L 222 125 Z" fill="url(#steelBlade)"/>
    <path d="M 250 35 L 250 125 L 278 125 Z" fill="#94a3b8" opacity="0.4"/>
    
    <!-- Sharp Crescent Goad Hook on side -->
    <path d="M 275 130 Q 320 120 335 85 Q 315 110 275 115 Z" fill="url(#steelBlade)"/>
    
    <!-- Red Royal Silk Tassels -->
    <path d="M 230 175 C 200 220 220 280 210 320 C 230 270 235 220 240 180 Z" fill="#ef4444"/>
    <path d="M 260 175 C 290 220 270 280 280 320 C 265 270 260 220 255 180 Z" fill="#dc2626"/>

  </g>
</svg>