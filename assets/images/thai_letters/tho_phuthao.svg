<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="grampsSkin" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="65%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </radialGradient>
    <radialGradient id="whiteBeard" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <linearGradient id="brownVest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="60%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Body & Brown Tweed Vest -->
    <path d="M 160 300 Q 250 280 340 300 L 360 435 Q 250 450 140 435 Z" fill="url(#brownVest)"/>
    <rect x="225" y="300" width="50" height="135" fill="#f8fafc"/>
    <circle cx="250" cy="340" r="5" fill="#431407"/>
    <circle cx="250" cy="380" r="5" fill="#431407"/>

    <!-- Head -->
    <circle cx="250" cy="185" r="95" fill="url(#grampsSkin)"/>

    <!-- Fluffy White Hair on sides -->
    <circle cx="160" cy="180" r="28" fill="url(#whiteBeard)"/>
    <circle cx="340" cy="180" r="28" fill="url(#whiteBeard)"/>

    <!-- Spectacles -->
    <circle cx="210" cy="175" r="24" fill="none" stroke="#64748b" stroke-width="4"/>
    <circle cx="290" cy="175" r="24" fill="none" stroke="#64748b" stroke-width="4"/>
    <line x1="234" y1="175" x2="266" y2="175" stroke="#64748b" stroke-width="4"/>
    <!-- Smiling Eyes behind glasses -->
    <path d="M 198 175 Q 210 162 222 175" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 278 175 Q 290 162 302 175" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Fluffy White Mustache and Beard -->
    <ellipse cx="250" cy="225" rx="50" ry="24" fill="url(#whiteBeard)"/>
    <path d="M 205 220 Q 250 285 295 220 Z" fill="url(#whiteBeard)"/>

    <!-- Wooden Walking Cane -->
    <path d="M 370 435 L 370 260 Q 370 230 395 230 Q 420 230 420 255" fill="none" stroke="#78350f" stroke-width="16" stroke-linecap="round"/>

  </g>
</svg>