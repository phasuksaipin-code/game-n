<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Room Wall Lighting -->
    <linearGradient id="roomWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Morning Sunlight Window -->
    <linearGradient id="sunBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Warm Oak Table in Foreground -->
    <linearGradient id="oakTable" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="tableBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Soft Depth of Field Blur for Background Items -->
    <filter id="bgBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    <!-- Contact Shadow Filter on Table -->
    <filter id="tableShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Character 3D Drop Shadow -->
    <filter id="charDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#451a03" flood-opacity="0.25"/>
    </filter>

    <!-- Universal Pixar Glossy Eye Gradient -->
    <radialGradient id="pixarEye" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="65%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <radialGradient id="boySkin2" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="65%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </radialGradient>
    <radialGradient id="helmet3d" cx="35%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>

  </defs>

  <!-- 1. Classroom Background Wall -->
  <rect width="500" height="500" rx="36" fill="url(#roomWall)"/>

  <!-- 2. Sunny Window on the Left -->
  <g opacity="0.85">
    <rect x="15" y="40" width="115" height="240" rx="10" fill="#bae6fd" stroke="#ffffff" stroke-width="6"/>
    <!-- Window Panes & Outdoor Garden Foliage -->
    <rect x="23" y="48" width="46" height="106" fill="#86efac" opacity="0.65"/>
    <rect x="75" y="48" width="46" height="106" fill="#86efac" opacity="0.65"/>
    <rect x="23" y="160" width="46" height="106" fill="#4ade80" opacity="0.65"/>
    <rect x="75" y="160" width="46" height="106" fill="#4ade80" opacity="0.65"/>
    <!-- Sunlight Beam Beam Angle -->
    <polygon points="15,40 130,40 320,380 90,380" fill="url(#sunBeam)"/>
  </g>

  <!-- 3. Kindergarten Classroom Background Shelves, Bunting & Toys -->
  <g filter="url(#bgBlur)" opacity="0.88">
    <!-- Colorful Pennant Garland Bunting across top -->
    <polygon points="120,20 145,55 170,20" fill="#ef4444"/>
    <polygon points="175,20 200,55 225,20" fill="#3b82f6"/>
    <polygon points="230,20 255,55 280,20" fill="#22c55e"/>
    <polygon points="285,20 310,55 335,20" fill="#facc15"/>
    <polygon points="340,20 365,55 390,20" fill="#ec4899"/>
    <polygon points="395,20 420,55 445,20" fill="#06b6d4"/>
    <line x1="110" y1="20" x2="455" y2="20" stroke="#ca8a04" stroke-width="2"/>

    <!-- Chalkboard / Pinboard on Right -->
    <rect x="360" y="55" width="125" height="160" rx="8" fill="#15803d" stroke="#b45309" stroke-width="6"/>
    <!-- Rainbow drawing on board -->
    <path d="M 390 140 A 30 30 0 0 1 450 140" fill="none" stroke="#ef4444" stroke-width="6"/>
    <path d="M 396 140 A 24 24 0 0 1 444 140" fill="none" stroke="#facc15" stroke-width="5"/>
    <path d="M 402 140 A 18 18 0 0 1 438 140" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <!-- Smiling Sun on board -->
    <circle cx="395" cy="85" r="12" fill="#facc15"/>

    <!-- Toy Shelves with Colorful Storage Bins -->
    <rect x="345" y="225" width="145" height="120" rx="6" fill="#fef08a" stroke="#d97706" stroke-width="4"/>
    <line x1="345" y1="285" x2="490" y2="285" stroke="#d97706" stroke-width="3"/>
    <!-- Plush Teddy Bear on shelf -->
    <circle cx="375" cy="260" r="16" fill="#b45309"/>
    <circle cx="375" cy="250" r="12" fill="#d97706"/>
    <circle cx="367" cy="242" r="5" fill="#d97706"/>
    <circle cx="383" cy="242" r="5" fill="#d97706"/>
    <!-- Colorful Alphabet Building Blocks -->
    <rect x="415" y="245" width="22" height="22" rx="4" fill="#ef4444"/>
    <rect x="442" y="245" width="22" height="22" rx="4" fill="#3b82f6"/>
    <rect x="430" y="223" width="22" height="22" rx="4" fill="#22c55e"/>

    <!-- Cute Pastel Storage Bins in Lower Shelf -->
    <rect x="355" y="295" width="55" height="42" rx="6" fill="#ec4899"/>
    <rect x="420" y="295" width="60" height="42" rx="6" fill="#0284c7"/>
  </g>

  <!-- 4. Warm Oak Wooden Table in Foreground -->
  <path d="M 0 350 L 500 350 L 500 500 L 0 500 Z" fill="url(#oakTable)"/>
  <rect x="0" y="346" width="500" height="8" fill="url(#tableBevel)"/>
  <!-- Colorful play mat edge on table -->
  <rect x="40" y="440" width="420" height="50" rx="8" fill="#a7f3d0" opacity="0.6"/>

  <!-- 5. 3D Character Contact Shadow on Tabletop -->
  <ellipse cx="250" cy="415" rx="135" ry="22" fill="#78350f" opacity="0.38" filter="url(#tableShadow)"/>
  <ellipse cx="250" cy="415" rx="85" ry="14" fill="#451a03" opacity="0.45" filter="url(#tableShadow)"/>

  <!-- 6. 3D Pixar Character Layer -->
  <g filter="url(#charDepth)">

    <!-- Body in Green Uniform -->
    <path d="M 175 280 Q 250 260 325 280 L 345 405 Q 250 420 155 405 Z" fill="#15803d"/>
    <rect x="175" y="345" width="150" height="20" fill="#1e293b"/>
    <rect x="235" y="341" width="30" height="28" rx="4" fill="#facc15"/>

    <!-- Head -->
    <circle cx="250" cy="185" r="85" fill="url(#boySkin2)"/>

    <!-- Cute Military Helmet with Golden Star -->
    <path d="M 155 160 Q 250 65 345 160 Q 250 145 155 160 Z" fill="url(#helmet3d)"/>
    <ellipse cx="250" cy="160" rx="100" ry="18" fill="#14532d"/>
    <polygon points="250,95 254,107 266,107 256,115 260,127 250,119 240,127 244,115 234,107 246,107" fill="#fde047"/>

    <!-- Big Pixar Eyes & Rosy Cheeks -->
    <circle cx="210" cy="190" r="15" fill="url(#pixarEye)"/>
    <circle cx="290" cy="190" r="15" fill="url(#pixarEye)"/>
    <circle cx="206" cy="184" r="5" fill="#ffffff"/>
    <circle cx="286" cy="184" r="5" fill="#ffffff"/>
    <circle cx="185" cy="210" r="16" fill="#f43f5e" opacity="0.3"/>
    <circle cx="315" cy="210" r="16" fill="#f43f5e" opacity="0.3"/>
    <path d="M 235 215 Q 250 230 265 215" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>

    <!-- Saluting Arm -->
    <path d="M 325 290 L 365 200 L 330 180" fill="none" stroke="url(#boySkin2)" stroke-width="24" stroke-linecap="round"/>

  </g>
</svg>