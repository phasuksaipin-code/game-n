<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>เกมจับคู่อาชีพและสถานที่ สำหรับเด็กปฐมวัย (10 หน้า)</title>
  <link rel="stylesheet" href="css/occupation-game.css?v=1.3.7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&family=Mitr:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="occ-viewport">
    <!-- Soft Background Ambient Decor Layer -->
    <div class="occ-bg-decor" aria-hidden="true"></div>

    <!-- Top Header -->
    <header class="occ-header">
      <div class="header-left">
        <!-- Back to Hub / Main Menu -->
        <a href="index.html" class="action-btn" title="กลับหน้าเมนูหลัก" style="text-decoration: none;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
        </a>
        <span class="version-tag-pill">v1.3.7</span>
      </div>

      <!-- Title Pill with Current Level Badge -->
      <div class="occ-title-pill">
        <span>🏢</span>
        <h1>เกมจับคู่อาชีพและสถานที่</h1>
        <span class="level-badge-pill" id="currentLevelBadge">หน้า 1 / 10</span>
      </div>

      <div class="header-right">
        <!-- Sound & Music Toggle -->
        <button class="action-btn" id="audioToggleBtn" title="เปิด/ปิด เสียง">
          <svg id="audioIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>

        <!-- Reset Current Level -->
        <button class="action-btn" id="btnResetBoard" title="เริ่มหน้าปัจจุบันใหม่">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Level Navigator Bar (10 Pages: หน้า 1 ถึง หน้า 10) -->
    <nav class="occ-levels-bar" id="levelsBar" aria-label="แถบเลือกหน้า 1-10">
      <!-- Injected dynamically via JavaScript -->
    </nav>

    <!-- Subtitle Instruction -->
    <div class="occ-hero-instruction" id="levelHeroText">
      <span>✨ ลากตัวละคร 4 อาชีพไปวางคู่กับสถานที่ทำงานที่ถูกต้อง ✨</span>
    </div>

    <!-- Main Game Playfield: Left Stage (4 Workstations) + Right Palette Sidebar -->
    <div class="occ-game-layout">
      <!-- Left: Stage Area for 4 Workstation Cards -->
      <main class="occ-stage-area" id="stageArea" aria-label="สถานีทำงาน 4 แห่ง">
        <!-- Injected dynamically via JavaScript -->
      </main>

      <!-- Right: Choices Palette Sidebar -->
      <aside class="occ-palette-sidebar" id="paletteSidebar" aria-label="พาเลตตัวเลือกตัวละคร">
        <div class="palette-header">
          <span class="palette-badge-icon">🎒</span>
          <span class="palette-badge-title">เลือกตัวละคร</span>
        </div>
        <div class="palette-tray" id="dockTray" role="list">
          <!-- Injected dynamically via JavaScript -->
        </div>
      </aside>
    </div>

  </div>

  <!-- Confetti Canvas for Victory Celebrations -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Celebration Modal Overlay -->
  <div class="celebration-overlay" id="celebrationOverlay" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="celebration-card">
      <div class="stars-row">
        <span class="star-pop">⭐</span>
        <span class="star-pop">⭐</span>
        <span class="star-pop">⭐</span>
      </div>

      <h2 class="celebration-title" id="celebrationTitle">🌟 เก่งมากครับ/ค่ะ! 🎈</h2>
      <p class="celebration-desc" id="celebrationDesc">หนูๆ จับคู่อาชีพกับสถานที่ทำงานได้ถูกต้องครบทุกจุดแล้ว!</p>

      <div class="celebration-actions">
        <button class="btn-celebrate btn-secondary" id="btnReplayLevel">
          <span>เล่นหน้านี้อีกครั้ง</span>
        </button>
        <button class="btn-celebrate btn-primary" id="btnNextLevel">
          <span>หน้าถัดไป</span>
          <span>➔</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/audio.js?v=1.3.7"></script>
  <script src="js/occupation-data.js?v=1.3.7"></script>
  <script src="js/occupation-game.js?v=1.3.7"></script>
</body>
</html>
