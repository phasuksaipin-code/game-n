<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>เกมโยงเส้นจับคู่ตัวเลขอารบิกกับเลขไทย (1-99) สำหรับเด็กปฐมวัย</title>
  <link rel="stylesheet" href="css/style.css?v=1.3.7">
  <link rel="stylesheet" href="css/number-matching.css?v=1.3.7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&family=Mitr:wght@500;700&family=Sarabun:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="number-viewport">
    <!-- Animated Soft Gradient Background Layer -->
    <div class="number-bg-layer" aria-hidden="true"></div>

    <!-- Top Header -->
    <header class="number-header">
      <div class="header-left">
        <!-- Back to Hub / Home Button -->
        <a href="index.html" class="action-btn" title="กลับหน้าเมนูหลัก" style="text-decoration: none;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
        </a>
        <span class="version-tag-pill">v1.3.7</span>
      </div>

      <!-- Title Pill with Current Round Badge -->
      <div class="number-title-pill">
        <span>🔢</span>
        <h1>เกมโยงเส้นตัวเลข (อารบิก - ไทย)</h1>
        <span class="round-badge-pill" id="currentRoundBadge">รอบที่ 1</span>
        <span class="counter-badge-pill" id="matchedCounterBadge">จับคู่สำเร็จ 0/5 คู่</span>
      </div>

      <div class="header-right">
        <!-- Sound Toggle -->
        <button class="action-btn" id="audioToggleBtn" title="เปิด/ปิด เสียง">
          <svg id="audioIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>

        <!-- Reset / New Round Button -->
        <button class="action-btn" id="btnResetGame" title="สุ่มตัวเลขรอบใหม่">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Tip / Instruction Bar -->
    <div class="instruction-bar">
      ✨ แตะหรือลากเส้นจากเลขอารบิกฝั่งซ้าย ไปหาเลขไทยฝั่งขวาที่ตรงกัน (สุ่ม 1-99)
    </div>

    <!-- Main Playing Arena -->
    <main class="matching-arena" id="matchingArena">
      <!-- SVG Lines Canvas Overlay -->
      <svg class="lines-svg-overlay" id="linesSvgOverlay"></svg>

      <!-- Left Column: Arabic Numerals -->
      <section class="column-container column-arabic" aria-label="คอลัมน์เลขอารบิก">
        <div class="column-header">
          <span>1 2 3</span>
          <span>เลขอารบิก</span>
        </div>
        <div class="cards-stack" id="arabicCardsStack">
          <!-- Injected via JavaScript -->
        </div>
      </section>

      <!-- Center Mascot / Decorative Spacer -->
      <div class="arena-center-guide" aria-hidden="true">
        <div class="center-icon-badge">✨</div>
      </div>

      <!-- Right Column: Thai Numerals -->
      <section class="column-container column-thai" aria-label="คอลัมน์เลขไทย">
        <div class="column-header">
          <span>๑ ๒ ๓</span>
          <span>เลขไทย</span>
        </div>
        <div class="cards-stack" id="thaiCardsStack">
          <!-- Injected via JavaScript -->
        </div>
      </section>
    </main>

  </div>

  <!-- Confetti Canvas -->
  <canvas id="confettiCanvas"></canvas>

  <!-- Celebration Modal Overlay -->
  <div class="celebration-overlay" id="celebrationOverlay" role="dialog" aria-modal="true" aria-labelledby="celebrationTitle">
    <div class="celebration-card">
      <div class="celebration-badge-icon">🎉</div>
      <h2 class="celebration-title" id="celebrationTitle">เก่งมากเลยคนเก่ง!</h2>
      <p class="celebration-subtitle" id="celebrationSubtitle">โยงเส้นจับคู่ตัวเลขครบ 5 คู่ถูกต้องทั้งหมดแล้ว</p>

      <div class="matched-summary-wrap" id="matchedSummaryWrap">
        <!-- Injected via JavaScript -->
      </div>

      <div class="celebration-actions">
        <button class="btn-celebration-replay" id="btnCelebrationReplay">
          <span>🔄</span>
          <span>เล่นรอบเดิม</span>
        </button>
        <button class="btn-celebration-next" id="btnCelebrationNext">
          <span>เล่นรอบใหม่ (สุ่มเลข)</span>
          <span>➔</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Game Scripts -->
  <script src="js/audio.js?v=1.3.7"></script>
  <script src="js/number-matching.js?v=1.3.7"></script>
</body>
</html>
